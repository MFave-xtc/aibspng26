{% extends "base.html" %}
{% block title %}{{ 'Edit Company' if company else 'Add Company' }} · PISC CRM{% endblock %}
{% block page_title %}{{ 'Edit Company' if company else 'Add Company' }}{% endblock %}
{% block content %}
<div class="card card-narrow">
  <form method="post" class="form">
    <label>Company name
      <input type="text" name="name" value="{{ company.name if company else '' }}" required autofocus>
    </label>
    <label>Type
      <select name="type">
        {% for t in COMPANY_TYPES %}
        <option value="{{ t }}" {{ 'selected' if company and company.type == t else '' }}>{{ t }}</option>
        {% endfor %}
      </select>
    </label>
    <div class="form-row">
      <label>Phone
        <input type="text" name="phone" value="{{ company.phone if company else '' }}">
      </label>
      <label>Email
        <input type="email" name="email" value="{{ company.email if company else '' }}">
      </label>
    </div>
    <label>Address
      <input type="text" name="address" value="{{ company.address if company else '' }}">
    </label>
    <label>Notes
      <textarea name="notes">{{ company.notes if company else '' }}</textarea>
    </label>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">{{ 'Save changes' if company else 'Add company' }}</button>
      <a href="{{ url_for('company_view', company_id=company.id) if company else url_for('companies_list') }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
